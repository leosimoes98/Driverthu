name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configurar EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependências
        working-directory: ./frontend
        run: npm install --force

      - name: Inicializar projeto EAS
        working-directory: ./frontend
        run: eas init --account leosimoes98s-team --force --non-interactive

      - name: Verificar configuração EAS
        working-directory: ./frontend
        run: eas project:info

      - name: Compilar APK via EAS
        working-directory: ./frontend
        run: eas build --platform android --profile preview --non-interactive
